name: KorridorX Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-test-and-validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=korridorx_ci;Username=postgres;Password=postgres
      Jwt__Issuer: KorridorX.CI
      Jwt__Audience: KorridorX.CI.Clients
      Jwt__Key: ci-only-key-that-is-longer-than-thirty-two-characters
      Hosting__AllowedOrigins__0: http://localhost:4200
      Hosting__RequireHttpsRedirection: false
      Hosting__SwaggerEnabled: false
      Hosting__JsonConsoleLogging: true
      Blaaiz__IsEnabled: false
      NotificationDelivery__WorkerEnabled: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore KorridorX.slnx

      - name: Build
        run: dotnet build KorridorX.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test KorridorX.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 9.0.7

      - name: Generate idempotent migration script
        run: dotnet ef migrations script --idempotent --no-build --configuration Release --output artifacts/migrations.sql

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korridorx-ci-artifacts
          path: artifacts
          if-no-files-found: warn
