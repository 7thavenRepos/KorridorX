name: KorridorX Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-test-and-validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: korridorx_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korridorx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=korridorx_ci;Username=postgres;Password=${{ github.run_id }}
      KORRIDORX_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=korridorx_ci;Username=postgres;Password=${{ github.run_id }}
      Jwt__Issuer: KorridorX.CI
      Jwt__Audience: KorridorX.CI.Clients
      Jwt__Key: ci-only-key-that-is-longer-than-thirty-two-characters
      Hosting__AllowedOrigins__0: http://localhost:4200
      Hosting__RequireHttpsRedirection: false
      Hosting__SwaggerEnabled: false
      Hosting__JsonConsoleLogging: true
      Blaaiz__IsEnabled: false
      ComplianceScreening__IsEnabled: false
      ComplianceScreening__TransactionMonitoring__IsEnabled: false
      Security__TransferRisk__IsEnabled: false
      NotificationDelivery__WorkerEnabled: false
      DataRetention__WorkerEnabled: false
      Support__SlaWorkerEnabled: false
      Treasury__WalletSyncWorkerEnabled: false
      Accounting__SyncWorkerEnabled: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore KorridorX.slnx

      - name: Build
        run: dotnet build KorridorX.slnx --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 9.0.7

      - name: Apply migrations to clean CI database
        run: dotnet ef database update --no-build --configuration Release

      - name: Test
        run: dotnet test KorridorX.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Generate idempotent migration script
        run: dotnet ef migrations script --idempotent --no-build --configuration Release --output artifacts/migrations.sql

      - name: Report pending EF model changes
        id: model_drift
        continue-on-error: true
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

      - name: Surface migration drift warning
        if: steps.model_drift.outcome == 'failure'
        run: |
          echo "::warning::EF Core reports pending model changes. Generate and review the release-candidate schema migration before enabling the migration-drift gate as blocking."

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korridorx-ci-artifacts
          path: artifacts
          if-no-files-found: warn

  deploy-staging:
    name: deploy-tested-commit-to-staging
    needs: build-test-and-validate-migrations
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.build-test-and-validate-migrations.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Download reviewed migration artifact
        uses: actions/download-artifact@v4
        with:
          name: korridorx-ci-artifacts
          path: release-artifact

      - name: Validate staging deployment inputs
        env:
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${STAGING_SSH_HOST:?GitHub staging variable STAGING_SSH_HOST is required}"
          : "${STAGING_SSH_USER:?GitHub staging variable STAGING_SSH_USER is required}"
          : "${STAGING_SSH_PRIVATE_KEY:?GitHub staging secret STAGING_SSH_PRIVATE_KEY is required}"
          : "${STAGING_SSH_KNOWN_HOSTS:?GitHub staging secret STAGING_SSH_KNOWN_HOSTS is required}"

          migration_file="$(find release-artifact -type f -name migrations.sql -print -quit)"
          if [[ -z "$migration_file" || ! -f "$migration_file" ]]; then
            echo "The successful CI artifact does not contain migrations.sql." >&2
            exit 1
          fi

          echo "KORRIDORX_MIGRATION_ARTIFACT=$migration_file" >> "$GITHUB_ENV"
          echo "PASS staging SSH configuration is present"
          echo "PASS reviewed migrations.sql artifact is present"

      - name: Configure staging SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/korridorx_staging"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/korridorx_staging"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload reviewed migration artifact
        env:
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/korridorx_staging" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "mkdir -p /opt/korridorx/artifacts"

          scp \
            -i "$HOME/.ssh/korridorx_staging" \
            "$KORRIDORX_MIGRATION_ARTIFACT" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:/opt/korridorx/artifacts/migrations.sql.next"

      - name: Deploy exact tested commit
        env:
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          TESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/korridorx_staging" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "TESTED_COMMIT_SHA='$TESTED_COMMIT_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          tested_sha="${TESTED_COMMIT_SHA:?Missing tested commit SHA}"
          cd /opt/korridorx

          if [[ ! -f .env.staging ]]; then
            echo "Missing server-owned /opt/korridorx/.env.staging; refusing deployment." >&2
            exit 1
          fi

          env_mode="$(stat -c '%a' .env.staging)"
          if [[ "$env_mode" != "600" ]]; then
            echo ".env.staging must have mode 600; current mode is $env_mode." >&2
            exit 1
          fi

          if [[ ! -f artifacts/migrations.sql.next ]]; then
            echo "Missing uploaded reviewed migration artifact." >&2
            exit 1
          fi

          echo "Fetching tested commit $tested_sha"
          git fetch --prune origin develop
          git cat-file -e "${tested_sha}^{commit}"
          git checkout --detach "$tested_sha"

          mv artifacts/migrations.sql.next artifacts/migrations.sql
          chmod +x scripts/deploy/*.sh

          echo "Deploying exact CI-tested commit: $(git rev-parse HEAD)"
          ./scripts/deploy/staging-deploy.sh
          ./scripts/deploy/staging-smoke-test.sh https://api.staging.korridorx.com
          REMOTE

      - name: Verify public staging health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            https://api.staging.korridorx.com/health/live
          echo
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            https://api.staging.korridorx.com/health/ready
          echo
          echo "KorridorX staging deployment is GREEN."

