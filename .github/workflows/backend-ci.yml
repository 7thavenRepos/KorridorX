name: KorridorX Backend CI and Staging Deployment

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

jobs:
  build-test-and-validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: korridorx_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korridorx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=korridorx_ci;Username=postgres;Password=postgres
      KORRIDORX_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=korridorx_ci;Username=postgres;Password=postgres
      Jwt__Issuer: KorridorX.CI
      Jwt__Audience: KorridorX.CI.Clients
      Jwt__Key: ci-only-key-that-is-longer-than-thirty-two-characters
      Hosting__AllowedOrigins__0: http://localhost:4200
      Hosting__RequireHttpsRedirection: false
      Hosting__SwaggerEnabled: false
      Hosting__JsonConsoleLogging: true
      Blaaiz__IsEnabled: false
      ComplianceScreening__IsEnabled: false
      ComplianceScreening__TransactionMonitoring__IsEnabled: false
      Security__TransferRisk__IsEnabled: false
      NotificationDelivery__WorkerEnabled: false
      DataRetention__WorkerEnabled: false
      Support__SlaWorkerEnabled: false
      Treasury__WalletSyncWorkerEnabled: false
      Accounting__SyncWorkerEnabled: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore KorridorX.slnx

      - name: Build
        run: dotnet build KorridorX.slnx --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 9.0.7

      - name: Apply migrations to clean CI database
        run: dotnet ef database update --no-build --configuration Release

      - name: Test
        run: dotnet test KorridorX.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Generate idempotent migration script
        run: dotnet ef migrations script --idempotent --no-build --configuration Release --output artifacts/migrations.sql

      - name: Report pending EF model changes
        id: model_drift
        continue-on-error: true
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

      - name: Surface migration drift warning
        if: steps.model_drift.outcome == 'failure'
        run: |
          echo "::warning::EF Core reports pending model changes. Generate and review the release-candidate schema migration before enabling the migration-drift gate as blocking."

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korridorx-ci-artifacts
          path: artifacts
          if-no-files-found: warn

  deploy-staging:
    name: Deploy tested commit to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-test-and-validate-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://api.staging.korridorx.com
    concurrency:
      group: korridorx-staging
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download validation artifacts
        uses: actions/download-artifact@v4
        with:
          name: korridorx-ci-artifacts
          path: ${{ runner.temp }}/korridorx-ci-artifacts

      - name: Locate reviewed migration script
        id: migration
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' migration_files < <(
            find "${RUNNER_TEMP}/korridorx-ci-artifacts" \
              -type f \
              -name migrations.sql \
              -print0
          )

          if [[ "${#migration_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one migrations.sql artifact, found ${#migration_files[@]}."
            exit 1
          fi

          printf 'migration_file=%s\n' "${migration_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Configure staging SSH connection
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          [[ -n "$STAGING_SSH_HOST" ]] || {
            echo "::error::The staging environment variable STAGING_SSH_HOST is required."
            exit 1
          }

          [[ -n "$STAGING_SSH_USER" ]] || {
            echo "::error::The staging environment variable STAGING_SSH_USER is required."
            exit 1
          }

          [[ -n "$STAGING_SSH_PRIVATE_KEY" ]] || {
            echo "::error::The staging environment secret STAGING_SSH_PRIVATE_KEY is required."
            exit 1
          }

          [[ -n "$STAGING_SSH_KNOWN_HOSTS" ]] || {
            echo "::error::The staging environment secret STAGING_SSH_KNOWN_HOSTS is required."
            exit 1
          }

          ssh_dir="${RUNNER_TEMP}/korridorx-staging-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"

      - name: Deploy exact tested commit
        id: deploy
        shell: bash
        env:
          MIGRATION_FILE: ${{ steps.migration.outputs.migration_file }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
        run: |
          set -euo pipefail

          ssh_dir="${RUNNER_TEMP}/korridorx-staging-ssh"
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          remote_deploy_dir="/tmp/korridorx-deploy-${GITHUB_SHA}"
          remote_migration="${remote_deploy_dir}/migrations.sql"
          ssh_options=(
            -i "$ssh_dir/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
          )

          ssh "${ssh_options[@]}" "$ssh_target" \
            "install -d -m 700 '$remote_deploy_dir'"

          scp "${ssh_options[@]}" \
            "$MIGRATION_FILE" \
            "$ssh_target:$remote_migration"

          ssh "${ssh_options[@]}" "$ssh_target" \
            "bash -s -- '$GITHUB_SHA' '$remote_migration'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          commit_sha="$1"
          migration_file="$2"
          project_dir="/opt/korridorx"

          cleanup_migration() {
            rm -f -- "$migration_file"
            rmdir -- "$(dirname "$migration_file")" 2>/dev/null || true
          }
          trap cleanup_migration EXIT

          cd "$project_dir"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Staging checkout is not clean; refusing automatic deployment." >&2
            git status --short >&2
            exit 1
          fi

          git fetch --prune origin develop
          git switch develop

          if ! git cat-file -e "${commit_sha}^{commit}"; then
            echo "Tested commit $commit_sha was not fetched from origin/develop." >&2
            exit 1
          fi

          current_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$current_sha" "$commit_sha"; then
            echo "Staging cannot fast-forward from $current_sha to $commit_sha." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$commit_sha" origin/develop; then
            echo "Tested commit $commit_sha is not contained in origin/develop." >&2
            exit 1
          fi

          git merge --ff-only "$commit_sha"

          if [[ "$(git rev-parse HEAD)" != "$commit_sha" ]]; then
            echo "Staging checkout does not match tested commit $commit_sha." >&2
            exit 1
          fi

          chmod 600 "$migration_file"
          KORRIDORX_MIGRATION_FILE="$migration_file" \
            ./scripts/deploy/staging-deploy.sh
          REMOTE_SCRIPT

      - name: Run public staging smoke tests
        id: smoke
        shell: bash
        run: ./scripts/deploy/staging-smoke-test.sh https://api.staging.korridorx.com

      - name: Roll back API after public smoke-test failure
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
        run: |
          set -euo pipefail

          ssh_dir="${RUNNER_TEMP}/korridorx-staging-ssh"
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"

          ssh \
            -i "$ssh_dir/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            "$ssh_target" \
            'cd /opt/korridorx && ./scripts/deploy/staging-rollback.sh'

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: |
          ssh_dir="${RUNNER_TEMP}/korridorx-staging-ssh"
          rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          rmdir "$ssh_dir" 2>/dev/null || true
