services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - korridorx-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - korridorx-staging

  api:
    image: korridorx-api:${KORRIDORX_IMAGE_TAG:-staging}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      AllowedHosts: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      Hosting__AllowedOrigins__0: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN is required}
      Hosting__RequireHttpsRedirection: ${REQUIRE_HTTPS_REDIRECTION:-true}
      Hosting__TrustedProxies__0: ${TRUSTED_PROXY_IP:-172.30.0.1}
      Hosting__ForwardLimit: 1
      Hosting__DataProtectionKeysPath: /var/lib/korridorx/keys
      Blaaiz__IsEnabled: ${BLAAIZ_ENABLED:-false}
      Blaaiz__ClientId: ${BLAAIZ_CLIENT_ID:-}
      Blaaiz__ClientSecret: ${BLAAIZ_CLIENT_SECRET:-}
      Blaaiz__WebhookSigningSecret: ${BLAAIZ_WEBHOOK_SIGNING_SECRET:-}
      ComplianceScreening__IsEnabled: ${COMPLIANCE_SCREENING_ENABLED:-false}
      ComplianceScreening__RequireRecentClearScreeningForPayout: ${COMPLIANCE_SCREENING_REQUIRE_CLEAR_FOR_PAYOUT:-false}
      ComplianceScreening__RescreeningWorkerEnabled: ${COMPLIANCE_RESCREENING_WORKER_ENABLED:-false}
      NotificationDelivery__WorkerEnabled: ${NOTIFICATION_WORKER_ENABLED:-false}
      NotificationDelivery__Smtp__IsEnabled: ${SMTP_ENABLED:-false}
      NotificationDelivery__Smtp__Host: ${SMTP_HOST:-}
      NotificationDelivery__Smtp__Port: ${SMTP_PORT:-587}
      NotificationDelivery__Smtp__Username: ${SMTP_USERNAME:-}
      NotificationDelivery__Smtp__Password: ${SMTP_PASSWORD:-}
      NotificationDelivery__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
    volumes:
      - korridorx-staging-dataprotection:/var/lib/korridorx/keys
    networks:
      - korridorx-staging

volumes:
  korridorx-staging-postgres:
  korridorx-staging-dataprotection:

networks:
  korridorx-staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
