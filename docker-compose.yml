services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-korridorx}
      POSTGRES_USER: ${POSTGRES_USER:-korridorx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - korridorx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-korridorx} -d ${POSTGRES_DB:-korridorx}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - korridorx

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-korridorx};Username=${POSTGRES_USER:-korridorx};Password=${POSTGRES_PASSWORD};Pooling=true
      Jwt__Issuer: ${JWT_ISSUER:-KorridorX}
      Jwt__Audience: ${JWT_AUDIENCE:-KorridorX.Clients}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
      Hosting__AllowedOrigins__0: ${ALLOWED_ORIGIN:-http://localhost:4200}
      Hosting__RequireHttpsRedirection: ${REQUIRE_HTTPS_REDIRECTION:-false}
      Hosting__DataProtectionKeysPath: /var/lib/korridorx/keys
      Security__Accounts__RequireConfirmedEmail: ${REQUIRE_CONFIRMED_EMAIL:-false}
      Security__Accounts__FrontendBaseUrl: ${ACCOUNT_FRONTEND_BASE_URL:-http://localhost:4200}
      Security__Accounts__TokenLifespanMinutes: ${ACCOUNT_TOKEN_LIFESPAN_MINUTES:-120}
      IdentitySeed__SeedTestUsers: ${IdentitySeed__SeedTestUsers:-false}
      IdentitySeed__SuperAdmin__FirstName: ${IdentitySeed__SuperAdmin__FirstName:-}
      IdentitySeed__SuperAdmin__LastName: ${IdentitySeed__SuperAdmin__LastName:-}
      IdentitySeed__SuperAdmin__Email: ${IdentitySeed__SuperAdmin__Email:-}
      IdentitySeed__SuperAdmin__Password: ${IdentitySeed__SuperAdmin__Password:-}
      IdentitySeed__SuperAdmin__PhoneNumber: ${IdentitySeed__SuperAdmin__PhoneNumber:-}
      IdentitySeed__SuperAdmin__CountryCode: ${IdentitySeed__SuperAdmin__CountryCode:-}
      IdentitySeed__TestUsers__Consumer__FirstName: ${IdentitySeed__TestUsers__Consumer__FirstName:-}
      IdentitySeed__TestUsers__Consumer__LastName: ${IdentitySeed__TestUsers__Consumer__LastName:-}
      IdentitySeed__TestUsers__Consumer__Email: ${IdentitySeed__TestUsers__Consumer__Email:-}
      IdentitySeed__TestUsers__Consumer__Password: ${IdentitySeed__TestUsers__Consumer__Password:-}
      IdentitySeed__TestUsers__Consumer__PhoneNumber: ${IdentitySeed__TestUsers__Consumer__PhoneNumber:-}
      IdentitySeed__TestUsers__Consumer__CountryCode: ${IdentitySeed__TestUsers__Consumer__CountryCode:-}
      IdentitySeed__TestUsers__BusinessOwner__FirstName: ${IdentitySeed__TestUsers__BusinessOwner__FirstName:-}
      IdentitySeed__TestUsers__BusinessOwner__LastName: ${IdentitySeed__TestUsers__BusinessOwner__LastName:-}
      IdentitySeed__TestUsers__BusinessOwner__Email: ${IdentitySeed__TestUsers__BusinessOwner__Email:-}
      IdentitySeed__TestUsers__BusinessOwner__Password: ${IdentitySeed__TestUsers__BusinessOwner__Password:-}
      IdentitySeed__TestUsers__BusinessOwner__PhoneNumber: ${IdentitySeed__TestUsers__BusinessOwner__PhoneNumber:-}
      IdentitySeed__TestUsers__BusinessOwner__CountryCode: ${IdentitySeed__TestUsers__BusinessOwner__CountryCode:-}
      IdentitySeed__TestUsers__BusinessAdministrator__FirstName: ${IdentitySeed__TestUsers__BusinessAdministrator__FirstName:-}
      IdentitySeed__TestUsers__BusinessAdministrator__LastName: ${IdentitySeed__TestUsers__BusinessAdministrator__LastName:-}
      IdentitySeed__TestUsers__BusinessAdministrator__Email: ${IdentitySeed__TestUsers__BusinessAdministrator__Email:-}
      IdentitySeed__TestUsers__BusinessAdministrator__Password: ${IdentitySeed__TestUsers__BusinessAdministrator__Password:-}
      IdentitySeed__TestUsers__BusinessAdministrator__PhoneNumber: ${IdentitySeed__TestUsers__BusinessAdministrator__PhoneNumber:-}
      IdentitySeed__TestUsers__BusinessAdministrator__CountryCode: ${IdentitySeed__TestUsers__BusinessAdministrator__CountryCode:-}
      IdentitySeed__TestUsers__ComplianceOfficer__FirstName: ${IdentitySeed__TestUsers__ComplianceOfficer__FirstName:-}
      IdentitySeed__TestUsers__ComplianceOfficer__LastName: ${IdentitySeed__TestUsers__ComplianceOfficer__LastName:-}
      IdentitySeed__TestUsers__ComplianceOfficer__Email: ${IdentitySeed__TestUsers__ComplianceOfficer__Email:-}
      IdentitySeed__TestUsers__ComplianceOfficer__Password: ${IdentitySeed__TestUsers__ComplianceOfficer__Password:-}
      IdentitySeed__TestUsers__SupportOfficer__FirstName: ${IdentitySeed__TestUsers__SupportOfficer__FirstName:-}
      IdentitySeed__TestUsers__SupportOfficer__LastName: ${IdentitySeed__TestUsers__SupportOfficer__LastName:-}
      IdentitySeed__TestUsers__SupportOfficer__Email: ${IdentitySeed__TestUsers__SupportOfficer__Email:-}
      IdentitySeed__TestUsers__SupportOfficer__Password: ${IdentitySeed__TestUsers__SupportOfficer__Password:-}
      IdentitySeed__TestUsers__OperationsOfficer__FirstName: ${IdentitySeed__TestUsers__OperationsOfficer__FirstName:-}
      IdentitySeed__TestUsers__OperationsOfficer__LastName: ${IdentitySeed__TestUsers__OperationsOfficer__LastName:-}
      IdentitySeed__TestUsers__OperationsOfficer__Email: ${IdentitySeed__TestUsers__OperationsOfficer__Email:-}
      IdentitySeed__TestUsers__OperationsOfficer__Password: ${IdentitySeed__TestUsers__OperationsOfficer__Password:-}
      IdentitySeed__TestUsers__Administrator__FirstName: ${IdentitySeed__TestUsers__Administrator__FirstName:-}
      IdentitySeed__TestUsers__Administrator__LastName: ${IdentitySeed__TestUsers__Administrator__LastName:-}
      IdentitySeed__TestUsers__Administrator__Email: ${IdentitySeed__TestUsers__Administrator__Email:-}
      IdentitySeed__TestUsers__Administrator__Password: ${IdentitySeed__TestUsers__Administrator__Password:-}
      IdentitySeed__Business__Name: ${IdentitySeed__Business__Name:-}
      IdentitySeed__Business__CountryCode: ${IdentitySeed__Business__CountryCode:-}
      Blaaiz__IsEnabled: ${BLAAIZ_ENABLED:-false}
      Blaaiz__ClientId: ${BLAAIZ_CLIENT_ID:-}
      Blaaiz__ClientSecret: ${BLAAIZ_CLIENT_SECRET:-}
      Blaaiz__WebhookSigningSecret: ${BLAAIZ_WEBHOOK_SIGNING_SECRET:-}
      ComplianceScreening__IsEnabled: ${COMPLIANCE_SCREENING_ENABLED:-false}
      ComplianceScreening__RequireRecentClearScreeningForPayout: ${COMPLIANCE_SCREENING_REQUIRE_CLEAR_FOR_PAYOUT:-false}
      ComplianceScreening__RescreeningWorkerEnabled: ${COMPLIANCE_RESCREENING_WORKER_ENABLED:-false}
      NotificationDelivery__WorkerEnabled: ${NOTIFICATION_WORKER_ENABLED:-false}
      NotificationDelivery__Smtp__IsEnabled: ${SMTP_ENABLED:-false}
      NotificationDelivery__Smtp__Host: ${SMTP_HOST:-}
      NotificationDelivery__Smtp__Port: ${SMTP_PORT:-587}
      NotificationDelivery__Smtp__Username: ${SMTP_USERNAME:-}
      NotificationDelivery__Smtp__Password: ${SMTP_PASSWORD:-}
      NotificationDelivery__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
    volumes:
      - korridorx-dataprotection:/var/lib/korridorx/keys
    networks:
      - korridorx

volumes:
  korridorx-postgres:
  korridorx-dataprotection:

networks:
  korridorx:
    driver: bridge
